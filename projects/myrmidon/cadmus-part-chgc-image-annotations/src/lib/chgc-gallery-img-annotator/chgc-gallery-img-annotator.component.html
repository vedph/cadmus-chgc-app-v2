<div class="progress">
  @if (picking() || imageLoading()) {
    <mat-progress-bar mode="indeterminate" />
  }
</div>
@if (error(); as e) {
  <div class="alert" role="alert">
    <mat-icon>error</mat-icon>
    <span>{{ e }}</span>
  </div>
}
<mat-tab-group
  mat-stretch-tabs="false"
  mat-align-tabs="start"
  [preserveContent]="true"
  [selectedIndex]="tabIndex()"
  (selectedIndexChange)="tabIndex.set($event)"
>
  <!-- annotator -->
  <mat-tab>
    <ng-template mat-tab-label>
      <mat-icon class="tab-icon">draw</mat-icon>
      annotator
    </ng-template>
    <div class="annotator">
      <section class="image-pane">
        @if (image(); as img) {
          <div class="image-bar">
            <img-annotator-toolbar
              [tools]="tools"
              [(tool)]="tool"
              [disabled]="!!disabled()"
            />
            <span class="image-title" [title]="img.uri">{{ img.title }}</span>
            <button
              type="button"
              mat-stroked-button
              [disabled]="!!disabled()"
              (click)="showGallery()"
            >
              <mat-icon>photo_library</mat-icon>
              change image
            </button>
          </div>
          <div class="image-frame">
            <img
              imgAnnotator
              [src]="img.uri"
              [alt]="img.title"
              [tool]="$any(tool())"
              [drawingEnabled]="!disabled()"
              (annotatorInit)="onAnnotatorInit($event)"
              (load)="onImageLoad()"
              (error)="onImageError()"
            />
          </div>
        } @else {
          <div class="empty-image">
            <mat-icon class="big-icon">image</mat-icon>
            <p>No image to annotate.</p>
            <button
              type="button"
              mat-flat-button
              [disabled]="!!disabled()"
              (click)="showGallery()"
            >
              <mat-icon>photo_library</mat-icon>
              pick an image
            </button>
          </div>
        }
      </section>
      <section class="list-pane" aria-labelledby="chgc-annotations-title">
        <h3 id="chgc-annotations-title" class="list-title">
          annotations
          <span class="count">{{ annotations().length }}</span>
        </h3>
        <cadmus-chgc-img-annotation-list
          [annotator]="annotator()"
          [editorComponent]="editorComponent"
          [annotationToString]="annotationToString"
          [image]="image()"
          [disabled]="!!disabled()"
          (listInit)="onListInit($event)"
        />
      </section>
    </div>
  </mat-tab>

  <!-- gallery -->
  <mat-tab>
    <ng-template mat-tab-label>
      <mat-icon class="tab-icon">photo_library</mat-icon>
      gallery
    </ng-template>
    <div class="gallery">
      <cadmus-gallery-list
        [entries]="safeFilterEntries()"
        [selectedId]="image()?.id"
        (imagePick)="onImagePick($event)"
      />
    </div>
  </mat-tab>
</mat-tab-group>
