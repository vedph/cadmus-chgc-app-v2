<!-- no <form> here: Enter in a text input saves when the editor is valid and dirty -->
<div class="editor" (keydown.enter)="onEnterKey($event)">
  @if (idEntriesError(); as error) {
    <div class="alert" role="alert">{{ error }}</div>
  }

  <!-- eid -->
  <div class="eid">
    <cadmus-refs-lookup
      label="ID"
      [service]="idLookupService"
      [item]="eidItem()"
      [required]="true"
      [options]="lookupOptions()"
      (itemChange)="onItemChange($event)"
    />
    @if (
      form.eid().getError('required') &&
      (form.eid().dirty() || form.eid().touched())
    ) {
      <div class="field-error" role="alert">ID required</div>
    }
  </div>

  <!-- label -->
  <mat-form-field class="full-width">
    <mat-label>label</mat-label>
    <input matInput [formField]="form.label" />
    @if (form.label().getError('maxLength')) {
      <mat-error>label too long</mat-error>
    }
  </mat-form-field>

  <!-- note -->
  <mat-form-field class="full-width">
    <mat-label>note</mat-label>
    <textarea
      matInput
      cdkTextareaAutosize
      cdkAutosizeMinRows="3"
      cdkAutosizeMaxRows="10"
      [formField]="form.note"
    ></textarea>
    @if (form.note().getError('maxLength')) {
      <mat-error>note too long</mat-error>
    }
  </mat-form-field>

  <!-- buttons -->
  <div class="buttons">
    <button
      type="button"
      mat-icon-button
      class="mat-warn"
      matTooltip="Discard changes"
      aria-label="discard changes"
      (click)="close()"
    >
      <mat-icon>clear</mat-icon>
    </button>
    <button
      type="button"
      mat-icon-button
      class="mat-primary"
      matTooltip="Accept changes"
      aria-label="accept changes"
      [disabled]="form().invalid() || !form().dirty()"
      (click)="save()"
    >
      <mat-icon>check_circle</mat-icon>
    </button>
  </div>
</div>
