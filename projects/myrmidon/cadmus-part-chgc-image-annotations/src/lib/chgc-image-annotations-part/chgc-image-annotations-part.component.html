<!-- no <form> here: the part is saved by the save button -->
<mat-card appearance="outlined">
  <mat-card-header>
    <div mat-card-avatar>
      <mat-icon>picture_in_picture</mat-icon>
    </div>
    <mat-card-title>
      {{ (modelName() | titlecase) || 'CHGC Image Annotations Part' }}
    </mat-card-title>
    <cadmus-help-link [url]="helpUrl()" />
  </mat-card-header>
  <mat-card-content>
    <cadmus-chgc-gallery-img-annotator
      [image]="image()"
      [annotations]="listAnnotations()"
      [filterEntries]="filterEntries()"
      [disabled]="!!disabled() || userLevel < 2"
      (imageChange)="onImageChange($event)"
      (annotationsChange)="onAnnotationsChange($event)"
    />
  </mat-card-content>
  <mat-card-actions class="actions">
    <cadmus-close-save-buttons
      [form]="form"
      [noSave]="userLevel < 2"
      (closeRequest)="close()"
      (saveRequest)="save()"
    />
    @if (form.annotations().getError('required')) {
      <span class="hint">at least one annotation is required</span>
    }
  </mat-card-actions>
</mat-card>
