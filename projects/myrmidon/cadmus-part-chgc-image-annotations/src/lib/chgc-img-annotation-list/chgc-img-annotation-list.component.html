@if (annotations().length) {
  <ol class="list" aria-label="annotations">
    @for (a of annotations(); track a.id; let i = $index) {
      <li class="item" [class.selected]="i === selectedIndex()">
        <button
          type="button"
          class="summary"
          [attr.aria-pressed]="i === selectedIndex()"
          [matTooltip]="i === selectedIndex() ? 'Deselect' : 'Select'"
          (click)="toggleSelection(a)"
        >
          <span class="index">{{ i + 1 }}</span>
          <span class="text">
            <span class="eid">{{
              annotationToString()(a) || '(no ID)'
            }}</span>
            @if (a.payload?.label) {
              <span class="label">{{ a.payload?.label }}</span>
            }
            @if (a.payload?.note) {
              <span class="note">{{ a.payload?.note }}</span>
            }
          </span>
          @if (getShapeType(i); as shape) {
            <span class="shape">{{ shape }}</span>
          }
        </button>
        <span class="actions">
          <button
            type="button"
            mat-icon-button
            class="mat-primary"
            matTooltip="Edit annotation"
            aria-label="edit annotation"
            [disabled]="disabled()"
            (click)="editAnnotationAt(i)"
          >
            <mat-icon>edit</mat-icon>
          </button>
          <button
            type="button"
            mat-icon-button
            class="mat-warn"
            matTooltip="Remove annotation"
            aria-label="remove annotation"
            [disabled]="disabled()"
            (click)="removeAnnotationAt(i)"
          >
            <mat-icon>delete</mat-icon>
          </button>
        </span>
      </li>
    }
  </ol>
} @else {
  <p class="empty">
    No annotations. Draw a shape on the image to add an annotation.
  </p>
}
